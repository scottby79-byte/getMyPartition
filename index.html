<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get My Partitions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #181b24;
            --bg-card: #202431;
            --bg-card-hover: #262b3a;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #2d3345;
            --badge-bg: #282f42;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
            --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.3);
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            padding: 24px 16px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 36px;
            padding-top: 12px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* SEARCH CARD */
        .search-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-md);
            margin-bottom: 36px;
            position: relative;
            overflow: hidden;
        }

        .search-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px;
            align-items: flex-end;
        }

        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 13px 14px 13px 42px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: #252b3b;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        .btn-search {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 13px 26px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-glow);
            height: 48px;
            min-width: 150px;
        }

        .btn-search:hover {
            opacity: 0.93;
            transform: translateY(-1px);
        }

        .btn-search:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .quick-suggestions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .suggestion-tag {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .suggestion-tag:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* SECTION TITLES */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count-badge {
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            color: var(--accent);
            font-size: 0.85rem;
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 600;
        }

        /* RESULTS GRID */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 40px;
        }

        .song-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .song-card:hover {
            border-color: #3b4256;
            background: var(--bg-card);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .song-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .song-artist {
            font-size: 1.05rem;
            color: #a5b4fc;
            font-weight: 600;
        }

        .tracks-list {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .track-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.78rem;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .track-badge.guitar { border-color: rgba(245, 158, 11, 0.4); color: #fbbf24; }
        .track-badge.bass { border-color: rgba(59, 130, 246, 0.4); color: #60a5fa; }
        .track-badge.drums { border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
        .track-badge.vocals { border-color: rgba(168, 85, 247, 0.4); color: #c084fc; }

        .song-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        @media (max-width: 640px) {
            .song-card {
                flex-direction: column;
                align-items: stretch;
            }
            .song-actions {
                justify-content: flex-end;
            }
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            background: var(--accent-green-hover);
            transform: translateY(-1px);
        }

        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-external {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-external:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
            background: #2b3244;
        }

        /* LOCAL FILES SECTION */
        .local-files-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .files-table-wrapper {
            overflow-x: auto;
            margin-top: 14px;
        }

        .files-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .files-table th {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .files-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
        }

        .files-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
        }

        .file-name-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #38bdf8 !important;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 0.72rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* EMPTY STATES & LOADERS */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            border-left: 4px solid var(--accent-green);
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="logo-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                Get My Partitions Band Suite
            </div>
            <h1>Partitions Guitar Pro</h1>
            <p class="subtitle">Recherche instantanée et téléchargement des partitions (.gp5) pour le groupe</p>
        </header>

        <!-- SEARCH FORM -->
        <div class="search-panel">
            <form class="search-form" id="searchForm">
                <div class="input-group">
                    <label for="artistInput">Nom de l'artiste</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="artistInput" placeholder="Ex: Izïa, Muse, Nirvana..." autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="titleInput">Titre du morceau</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polygon points="10 8 16 12 10 16 10 8"></polygon>
                        </svg>
                        <input type="text" id="titleInput" placeholder="Ex: Let Me Alone, Hysteria..." autocomplete="off">
                    </div>
                </div>

                <button type="submit" class="btn-search" id="searchBtn">
                    <span id="btnSearchIcon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <span id="btnSearchText">Rechercher</span>
                </button>
            </form>
<!--
            <div class="quick-suggestions">
                <span>Suggestions rapides :</span>
                <span class="suggestion-tag" onclick="quickFill('Izïa', 'Let Me Alone')">Izïa - Let Me Alone</span>
                <span class="suggestion-tag" onclick="quickFill('Muse', 'Hysteria')">Muse - Hysteria</span>
                <span class="suggestion-tag" onclick="quickFill('Nirvana', 'Smells Like Teen Spirit')">Nirvana - Smells Like Teen Spirit</span>
                <span class="suggestion-tag" onclick="quickFill('Red Hot Chili Peppers', 'Californication')">RHCP - Californication</span>
            </div>
-->
        </div>

        <!-- SEARCH RESULTS -->
        <section id="resultsSection" style="display: none;">
            <div class="section-header">
                <h2 class="section-title">
                    <span>Résultats trouvés</span>
                    <span class="count-badge" id="resultsCount">0</span>
                </h2>
            </div>
            <div class="results-grid" id="resultsGrid"></div>
        </section>

        <!-- LOCAL DOWNLOADED FILES -->
        <section class="local-files-panel">
            <div class="section-header">
                <h2 class="section-title">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" color="#10b981">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Partitions locales sauvegardées
                    <span class="count-badge" id="localFilesCount">0</span>
                </h2>
                <button class="btn-external" onclick="loadLocalFiles()" title="Rafraîchir">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                    </svg>
                    Actualiser
                </button>
            </div>
            <div class="files-table-wrapper">
                <table class="files-table">
                    <thead>
                        <tr>
                            <th>Nom du fichier</th>
                            <th>Taille</th>
                            <th>Date d'ajout</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="localFilesBody">
                        <tr>
                            <td colspan="4" class="empty-state">Chargement des fichiers...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const artistInput = document.getElementById('artistInput');
        const titleInput = document.getElementById('titleInput');
        const searchBtn = document.getElementById('searchBtn');
        const btnSearchIcon = document.getElementById('btnSearchIcon');
        const btnSearchText = document.getElementById('btnSearchText');
        const resultsSection = document.getElementById('resultsSection');
        const resultsGrid = document.getElementById('resultsGrid');
        const resultsCount = document.getElementById('resultsCount');
        const localFilesBody = document.getElementById('localFilesBody');
        const localFilesCount = document.getElementById('localFilesCount');

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${type === 'success' ? '✅' : '❌'}</span>
                <div>${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function quickFill(artist, title) {
            artistInput.value = artist;
            titleInput.value = title;
            searchForm.dispatchEvent(new Event('submit'));
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Octet';
            const k = 1024;
            const sizes = ['Octets', 'Ko', 'Mo'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleDateString('fr-FR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // RECHERCHE
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const artist = artistInput.value.trim();
            const title = titleInput.value.trim();

            if (!artist && !title) {
                showToast("Veuillez indiquer un artiste ou un titre", "error");
                return;
            }

            // Spinner state
            searchBtn.disabled = true;
            btnSearchIcon.innerHTML = `<div class="spinner"></div>`;
            btnSearchText.textContent = "Recherche...";

            try {
                const params = new URLSearchParams();
                if (artist) params.append('artist', artist);
                if (title) params.append('title', title);

                const response = await fetch(`/api/search?${params.toString()}`);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Erreur lors de la recherche');
                }

                renderResults(data.results);
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                searchBtn.disabled = false;
                btnSearchIcon.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                `;
                btnSearchText.textContent = "Rechercher";
            }
        });

        function getTrackClass(instName) {
            const name = (instName || '').toLowerCase();
            if (name.includes('bass')) return 'bass';
            if (name.includes('drum')) return 'drums';
            if (name.includes('guitar')) return 'guitar';
            if (name.includes('vocal') || name.includes('voice') || name.includes('sax')) return 'vocals';
            return '';
        }

        function getTrackIcon(instName) {
            const name = (instName || '').toLowerCase();
            if (name.includes('bass')) return '🎸';
            if (name.includes('drum')) return '🥁';
            if (name.includes('guitar')) return '🎸';
            if (name.includes('vocal') || name.includes('voice')) return '🎤';
            if (name.includes('piano') || name.includes('synth') || name.includes('key')) return '🎹';
            return '🎵';
        }

        function renderResults(songs) {
            resultsGrid.innerHTML = '';
            resultsSection.style.display = 'block';

            if (!songs || songs.length === 0) {
                resultsCount.textContent = '0';
                resultsGrid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <p>Aucune partition trouvée pour cette recherche.</p>
                    </div>
                `;
                return;
            }

            resultsCount.textContent = songs.length;

            songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card';

                // Badges d'instruments
                let tracksHtml = '';
                if (song.tracks && song.tracks.length > 0) {
                    tracksHtml = song.tracks.map(t => {
                        const cls = getTrackClass(t.instrument || t.name);
                        const icon = getTrackIcon(t.instrument || t.name);
                        const name = t.name || t.instrument || 'Piste';
                        return `<span class="track-badge ${cls}">${icon} ${name}</span>`;
                    }).join('');
                }

                card.innerHTML = `
                    <div class="song-info">
                        <div class="song-title-row">
                            <span class="song-title">${song.title}</span>
                            <span class="song-artist">${song.artist}</span>
                        </div>
                        <div class="tracks-list">
                            ${tracksHtml || '<span class="track-badge">🎸 Tablature</span>'}
                        </div>
                    </div>
                    <div class="song-actions">
                        <a href="https://www.songsterr.com/a/wsa/${encodeURIComponent(song.artist.toLowerCase())}-${encodeURIComponent(song.title.toLowerCase())}-tab-s${song.songId}" 
                           target="_blank" 
                           rel="noopener" 
                           class="btn-external" 
                           title="Aperçu et lecture sur Songsterr">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                <polyline points="15 3 21 3 21 9"></polyline>
                                <line x1="10" y1="14" x2="21" y2="3"></line>
                            </svg>
                            Player
                        </a>
                        <button class="btn-download" onclick="downloadSong(${song.songId}, this)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            Télécharger (Guitar Pro )
                        </button>
                    </div>
                `;
                resultsGrid.appendChild(card);
            });
        }

        // TÉLÉCHARGEMENT DU MORCEAU
        async function downloadSong(songId, btn) {
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<div class="spinner"></div> Téléchargement...`;

            try {
                // Appel API backend pour récupérer la source et enregistrer localement
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: songId })
                });

                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Erreur de téléchargement');
                }

                showToast(`Partition '${data.filename}' enregistrée dans le dossier partitions !`);
                
                // Déclencher également le téléchargement direct dans le navigateur
                const dlLink = document.createElement('a');
                dlLink.href = `/api/local-download?file=${encodeURIComponent(data.filename)}`;
                dlLink.download = data.filename;
                document.body.appendChild(dlLink);
                dlLink.click();
                dlLink.remove();

                // Rafraîchir la liste locale
                loadLocalFiles();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }

        // LISTE DES FICHIERS LOCAUX
        async function loadLocalFiles() {
            try {
                const res = await fetch('/api/local-files');
                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Erreur lors du scan local');
                }

                const files = data.files || [];
                localFilesCount.textContent = files.length;

                if (files.length === 0) {
                    localFilesBody.innerHTML = `
                        <tr>
                            <td colspan="4" class="empty-state">
                                Aucun fichier de partition (.gp / .gp5) dans le dossier pour le moment.
                            </td>
                        </tr>
                    `;
                    return;
                }

                localFilesBody.innerHTML = files.map(file => `
                    <tr>
                        <td class="file-name-cell">
                            <span class="file-badge">${file.name.toLowerCase().endsWith('.gp5') ? 'GP5' : (file.name.toLowerCase().endsWith('.gp') ? 'GP' : 'TAB')}</span>
                            ${file.name}
                        </td>
                        <td>${formatBytes(file.size)}</td>
                        <td>${formatDate(file.modified)}</td>
                        <td>
                            <a href="/api/local-download?file=${encodeURIComponent(file.name)}" 
                               class="btn-external" 
                               download="${file.name}">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                Télécharger
                            </a>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                localFilesBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="empty-state" style="color: #ef4444;">
                            Erreur : ${err.message}
                        </td>
                    </tr>
                `;
            }
        }

        // Chargement initial
        loadLocalFiles();
    </script>
</body>
</html>
